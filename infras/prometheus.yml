global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "market-data"
    static_configs:
      - targets: ["host.docker.internal:9001"]

  - job_name: "strategy-engine"
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: "execution-engine"
    static_configs:
      - targets: ["host.docker.internal:9201"]

  - job_name: "risk-engine"
    static_configs:
      - targets: ["host.docker.internal:9301"]

  - job_name: "pricing-engine"
    static_configs:
      - targets: ["host.docker.internal:9501"]

  - job_name: "feature-engine"
    static_configs:
      - targets: ["host.docker.internal:9601"]