[package]
name = "rust-options-pricer"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.1"
rayon = "1.12.0"
statrs = "0.18.0"

axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tower-http = { version = "0.6", features = ["cors"] }