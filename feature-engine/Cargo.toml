[package]
name = "feature-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
prometheus = "0.13"
tower-http = { version = "0.5", features = ["cors"] }