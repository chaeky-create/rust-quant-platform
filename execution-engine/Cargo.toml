[package]
name = "execution-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared-types = { path = "../shared-types" }
axum = { version = "0.7", features = ["ws"] }
redis = { version = "0.27", features = ["tokio-comp"] }
prometheus = "0.13"
